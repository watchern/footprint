name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          # 锁定 Flutter 版本，避免 stable 通道自动升级导致 CI 与本地不一致
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Use official Gradle distribution on CI
        run: |
          # 仓库内的 wrapper 默认指向国内镜像（本地开发用），
          # CI 在境外，切回官方源以避免下载超时。
          sed -i 's|https://mirrors.cloud.tencent.com/gradle/|https://services.gradle.org/distributions/|' \
            android/gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log

      - name: Report failure details
        if: failure()
        run: |
          {
            echo "## 构建失败日志（末尾 60 行）"
            echo '```'
            tail -n 60 build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 通过 annotation 上报，便于在 GitHub 页面直接看到失败原因
          tail -n 30 build.log | grep -E "FAILURE|error:|Error|Could not|Exception|Caused by|what went wrong" \
            | head -n 10 | while IFS= read -r line; do
              echo "::error title=构建失败::${line}"
            done || true

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: footprints-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: 本地足迹 ${{ github.ref_name }}
          body: |
            安卓 APK 自动发布。

            - 所有数据仅存本地设备，无注册、无云端、无好友共享
            - 轨迹坐标以 WGS-84 存储，渲染时按底图坐标系换算
            - 底图源可插拔，支持 OSM 镜像与 MBTiles 离线包
