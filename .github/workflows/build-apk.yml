name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          # 锁定 Flutter 版本，避免 stable 通道自动升级导致 CI 与本地不一致
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Use official Gradle distribution on CI
        run: |
          # 仓库内的 wrapper 默认指向国内镜像（本地开发用），
          # CI 在境外，切回官方源以避免下载超时。
          sed -i 's|https://mirrors.cloud.tencent.com/gradle/|https://services.gradle.org/distributions/|' \
            android/gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Read version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log
          # 产物重命名为带版本号的 ASCII 文件名：
          # 中文文件名在 gh CLI / softprops 的 glob 解析中会被吃掉前缀，
          # ASCII 名可确保 Release 资产名正确带版本号。
          cp build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/foot_print_v${{ steps.version.outputs.version }}.apk"

      - name: Report failure details
        if: failure()
        run: |
          {
            echo "## 构建失败日志（末尾 60 行）"
            echo '```'
            tail -n 60 build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 通过 annotation 上报，便于在 GitHub 页面直接看到失败原因
          tail -n 30 build.log | grep -E "FAILURE|error:|Error|Could not|Exception|Caused by|what went wrong" \
            | head -n 10 | while IFS= read -r line; do
              echo "::error title=构建失败::${line}"
            done || true

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: foot_print_v${{ steps.version.outputs.version }}
          path: build/app/outputs/flutter-apk/foot_print_v${{ steps.version.outputs.version }}.apk

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          # ASCII 资产名，避免中文在 gh CLI/glob 解析中丢失
          ASSET="foot_print_v${VERSION}.apk"
          SRC="build/app/outputs/flutter-apk/${ASSET}"
          ls -l "$SRC"
          echo "::notice title=发布目标::TAG=$TAG ASSET=$ASSET"

          NOTES="本地足迹 $TAG — 安卓 APK。数据仅存本地设备，无注册无云端；轨迹以 WGS-84 存储，支持 OSM 镜像与 MBTiles 离线包。"

          # 先创建；若 tag 上已有 release 则回退为 upload，并清理旧资产保证幂等
          if gh release create "$TAG" "$SRC" \
               --title "本地足迹 $TAG" --notes "$NOTES" 2>create.err; then
            echo "::notice::release created"
          else
            echo "::notice::release exists, cleanup and upload"
            cat create.err
            for id in $(gh release view "$TAG" --json assets --jq '.assets[].id'); do
              gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id" >/dev/null
            done
            gh release upload "$TAG" "$SRC" --clobber
          fi

          echo "::notice title=发布确认::$(gh release view "$TAG" --json assets --jq '[.assets[].name] | join(",")')"
