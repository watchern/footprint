name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          # 锁定 Flutter 版本，避免 stable 通道自动升级导致 CI 与本地不一致
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Use official Gradle distribution on CI
        run: |
          # 仓库内的 wrapper 默认指向国内镜像（本地开发用），
          # CI 在境外，切回官方源以避免下载超时。
          sed -i 's|https://mirrors.cloud.tencent.com/gradle/|https://services.gradle.org/distributions/|' \
            android/gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Read version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log
          # 产物重命名为带版本号的文件名，便于用户识别与管理
          cp build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/本地足迹-v${{ steps.version.outputs.version }}.apk"

      - name: Report failure details
        if: failure()
        run: |
          {
            echo "## 构建失败日志（末尾 60 行）"
            echo '```'
            tail -n 60 build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 通过 annotation 上报，便于在 GitHub 页面直接看到失败原因
          tail -n 30 build.log | grep -E "FAILURE|error:|Error|Could not|Exception|Caused by|what went wrong" \
            | head -n 10 | while IFS= read -r line; do
              echo "::error title=构建失败::${line}"
            done || true

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 本地足迹-v${{ steps.version.outputs.version }}
          path: build/app/outputs/flutter-apk/本地足迹-v${{ steps.version.outputs.version }}.apk

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          # 直接用带版本号的中文文件名作为源文件：gh 上传时资产名取源文件 basename，
          # 不能用 file#label 语法（# 后面只是显示 label，不是文件名）。
          ASSET="本地足迹-v${VERSION}.apk"
          SRC="build/app/outputs/flutter-apk/${ASSET}"
          ls -l "$SRC"
          echo "::notice title=发布目标::TAG=$TAG ASSET=$ASSET"

          NOTES="安卓 APK 自动发布。数据仅存本地设备，无注册无云端；轨迹以 WGS-84 存储，支持 OSM 镜像与 MBTiles 离线包。"

          # 先尝试 create；若 tag 上已有 release 则回退为 upload。
          if gh release create "$TAG" "$SRC" \
               --title "本地足迹 $TAG" --notes "$NOTES" 2>create.err; then
            echo "::notice::release created"
          else
            echo "::notice::release exists, fallback to upload"
            cat create.err
            gh release upload "$TAG" "$SRC" --clobber
          fi

          # 发布后确认资产名（写入 annotation 便于核验）
          echo "::notice title=发布确认::$(gh release view "$TAG" --json name,assets --jq '.name + " | " + ([.assets[].name] | join(","))')"
